CONFIG_GPIO=y
CONFIG_I2C=y

CONFIG_LOG=y
CONFIG_SHELL=y

# RTT shell (recommended on macOS)
CONFIG_USE_SEGGER_RTT=y
CONFIG_SHELL_BACKEND_RTT=y

# I2C shell commands
CONFIG_I2C_SHELL=y

# GPIO shell commands
CONFIG_GPIO_SHELL=y

# Disable shell echo (JLinkRTTClient provides its own)
CONFIG_SHELL_ECHO_STATUS=n

# USB CDC-ACM shell (over USB-C connector)
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_CDC_ACM=y
CONFIG_UART_LINE_CTRL=y
CONFIG_SHELL_BACKEND_SERIAL=y

# Bluetooth (for antenna testing via nRF Connect)
CONFIG_BT=y
CONFIG_BT_DEVICE_NAME="nRF52840 Bringup"

